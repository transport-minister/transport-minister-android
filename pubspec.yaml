name: transport_minister
description: "A city transportation management tycoon game."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: any
  material_ui: ^1.11.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/fredoka/OFL.txt
    - assets/fonts/nunito/OFL.txt
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/fredoka/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/fredoka/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/fredoka/Fredoka-Bold.ttf
          weight: 700
    - family: NunitoFallback
      fonts:
        - asset: assets/fonts/nunito/NunitoFallback-SemiBold.ttf
          weight: 500
        - asset: assets/fonts/nunito/NunitoFallback-Bold.ttf
          weight: 600
        - asset: assets/fonts/nunito/NunitoFallback-ExtraBold.ttf
          weight: 700
