name: transport_minister
description: "A city transportation management tycoon game."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.14.0

dependencies:
  audioplayers: ^6.8.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.3.1
  intl: any
  json_annotation: ^4.12.0
  material_ui: ^1.11.0
  package_info_plus: ^10.2.2

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/fredoka/OFL.txt
    - assets/fonts/nunito/OFL.txt
    - assets/sounds/
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/fredoka/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/fredoka/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/fredoka/Fredoka-Bold.ttf
          weight: 700
